name: Qualidade

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: qualidade-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: verificar-ativacao
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5
      - run: pnpm install --frozen-lockfile
        env:
          LEFTHOOK: '0'
      # `verificar:ativacao` inclui `verificar:celular`, que mede layout em navegador de
      # verdade — jsdom não faz layout, e medir rolagem ou alvo de toque ali seria evidência
      # falsa. O runner não traz o navegador, então ele é baixado aqui. Sem esta etapa os 14
      # cenários falham com "Executable doesn't exist", que foi o que derrubou o gate na
      # primeira execução depois de a prova de celular entrar na cadeia.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run verificar:ativacao
