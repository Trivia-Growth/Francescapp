[build]
  functions = "netlify/functions"
  command = "pnpm run build:web"
  publish = "web/dist"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "9.15.9"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/convite-familiar/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'none'"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

# Service worker da casca offline (FR-071). `no-cache` obriga a revalidação do próprio script a
# cada atualização: sem isso o aparelho pode ficar preso numa versão antiga do worker, e a
# reversão da tarefa 1.6 depende de o navegador buscar o conteúdo novo deste endereço.
# Não altera os cabeçalhos de `/api/*`, que continuam `no-store`.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/casca-regras.js"
  [headers.values]
    Cache-Control = "no-cache"
