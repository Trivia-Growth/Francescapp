<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>Bancada de medição | Financeiro no celular</title>
    <!-- Mesma folha de estilo da aplicação: a medição precisa valer para o produto.
         `tema.css`, não `styles.css` direto — é o que `index.html` carrega de verdade, e é
         ele que traz `estilos/ui.css` na camada certa. Sem ele, `.ui-data[data-aprimorada] >
         input[type=date]` (que esconde o nativo depois do aprimoramento) não existe aqui,
         e a bancada mentiria sobre o que o produto mostra. -->
    <link rel="stylesheet" href="/web/estilos/tema.css">
    <script type="module" src="./financeiro.ts"></script>
  </head>
  <body>
    <!-- Mesmo encaixe do produto: área de administração dentro do conteúdo principal. -->
    <main id="conteudo" tabindex="-1">
      <section class="administracao" aria-labelledby="bancada-title">
        <div><h1 id="bancada-title" tabindex="-1">Administração</h1></div>
        <div id="raiz" class="administracao-conteudo"></div>
      </section>
    </main>
  </body>
</html>
